<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enhetssirkelen</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090c; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  // Enhetssirkelen – sin og cos som skjermsparer. Ingen avhengigheter, virker offline.
  const PERIODE = 14;            // sekunder per omløp
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const TAU = Math.PI * 2;
  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();
  // Klikk/dobbeltklikk = fullskjerm når fila åpnes i nettleser
  addEventListener('dblclick', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); });

  const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
  const fmt = v => (v < 0 ? '−' : '') + Math.abs(v).toFixed(3).replace('.', ',');
  const t0 = performance.now();

  function frame(now) {
    const t = (now - t0) / 1000;
    const th = (t / PERIODE) * TAU;                       // vinkel θ
    const hue = (200 + t * 0.6) % 360;                    // langsom fargedrift
    const cSin = hsl((hue + 160) % 360, 85, 62), cCos = hsl(hue, 85, 64);
    // Liten drift mot innbrenning (± ~1,5 % av skjermen over noen minutter)
    const dx = Math.sin(t / 97) * W * 0.015, dy = Math.cos(t / 131) * H * 0.015;

    const R = Math.min(H * 0.21, W * 0.15);
    const cx = W * 0.24 + dx, cy = H * 0.34 + dy;
    const k = R * 0.42;                                   // px per radian i bølgene
    const gap = R * 0.35;
    const xs0 = cx + R + gap, ys0 = cy + R + gap;         // start for sin- og cos-bølge
    const s = Math.sin(th), c = Math.cos(th), px = cx + R * c, py = cy - R * s;

    ctx.fillStyle = '#07090c'; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // Rutenett, svakt
    ctx.strokeStyle = 'rgba(120,140,160,0.06)'; ctx.lineWidth = 1;
    const g = R / 2;
    ctx.beginPath();
    for (let x = cx % g; x < W; x += g) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = cy % g; y < H; y += g) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    // Akser
    ctx.strokeStyle = 'rgba(200,210,220,0.22)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx - R * 1.25, cy); ctx.lineTo(W, cy);           // x-akse forlenget for sin
    ctx.moveTo(cx, cy - R * 1.25); ctx.lineTo(cx, H);           // y-akse forlenget for cos
    ctx.stroke();
    // Akser for bølgene (−1 og 1)
    ctx.setLineDash([2, 6]); ctx.strokeStyle = 'rgba(200,210,220,0.12)';
    ctx.beginPath();
    ctx.moveTo(xs0, cy - R); ctx.lineTo(W, cy - R); ctx.moveTo(xs0, cy + R); ctx.lineTo(W, cy + R);
    ctx.moveTo(cx - R, ys0); ctx.lineTo(cx - R, H); ctx.moveTo(cx + R, ys0); ctx.lineTo(cx + R, H);
    ctx.stroke(); ctx.setLineDash([]);

    // Enhetssirkelen
    ctx.strokeStyle = 'rgba(220,228,236,0.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();

    // Vinkelbue θ
    const thm = ((th % TAU) + TAU) % TAU;
    ctx.strokeStyle = 'rgba(240,240,240,0.5)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.18, 0, -thm, true); ctx.stroke();

    // Trekant: cos (vannrett), sin (loddrett), radius
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, cy); ctx.lineTo(px, py); ctx.closePath(); ctx.fill();
    const glow = (col, w, f) => { ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.strokeStyle = col; ctx.lineWidth = w; f(); ctx.restore(); };
    glow(cCos, 3.5, () => { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, cy); ctx.stroke(); });
    glow(cSin, 3.5, () => { ctx.beginPath(); ctx.moveTo(px, cy); ctx.lineTo(px, py); ctx.stroke(); });
    ctx.strokeStyle = 'rgba(235,240,245,0.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();

    // Bølger: sin mot høyre, cos nedover. Punktet "skyves ut" fra sirkelen.
    function wave(col, horizontal) {
      const L = horizontal ? W - xs0 : H - ys0, N = Math.max(60, Math.floor(L / 3));
      const seg = 24;
      for (let a = 0; a < N; a += seg) {
        ctx.beginPath();
        for (let i = a; i <= Math.min(N, a + seg); i++) {
          const d = i / N * L, ph = th - d / k;
          const x = horizontal ? xs0 + d : cx + R * Math.cos(ph);
          const y = horizontal ? cy - R * Math.sin(ph) : ys0 + d;
          i === a ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.globalAlpha = 0.95 * Math.pow(1 - a / N, 1.6) + 0.05;
        ctx.strokeStyle = col; ctx.lineWidth = 2.6; ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.save(); ctx.shadowColor = cSin; ctx.shadowBlur = 10; wave(cSin, true); ctx.restore();
    ctx.save(); ctx.shadowColor = cCos; ctx.shadowBlur = 10; wave(cCos, false); ctx.restore();

    // Forbindelseslinjer fra punktet til bølgene
    ctx.setLineDash([4, 5]); ctx.lineWidth = 1.2;
    ctx.strokeStyle = cSin; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(xs0, py); ctx.stroke();
    ctx.strokeStyle = cCos;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, ys0); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;

    // Punkter
    const dot = (x, y, col, r) => { ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore(); };
    dot(px, py, '#f4f6f8', 6);
    dot(xs0, py, cSin, 5);
    dot(px, ys0, cCos, 5);
    dot(cx, cy, 'rgba(240,240,240,0.7)', 2.5);

    // Tekst
    const fs = Math.max(13, R * 0.085);
    ctx.font = `500 ${fs}px "Segoe UI", system-ui, sans-serif`; ctx.textBaseline = 'middle';
    const deg = thm * 180 / Math.PI;
    ctx.fillStyle = 'rgba(235,240,245,0.85)';
    ctx.fillText(`θ = ${deg.toFixed(0).padStart(3, ' ')}°  =  ${(thm / Math.PI).toFixed(2).replace('.', ',')}π rad`, cx - R * 1.2, cy - R * 1.32);
    ctx.fillStyle = cSin; ctx.fillText(`sin θ = ${fmt(s)}`, xs0 + 10, cy - R * 1.32);
    ctx.fillStyle = cCos; ctx.fillText(`cos θ = ${fmt(c)}`, cx + R * 1.3, ys0 + fs);
    ctx.fillStyle = 'rgba(235,240,245,0.55)';
    ctx.fillText(`sin²θ + cos²θ = ${(s * s).toFixed(3).replace('.', ',')} + ${(c * c).toFixed(3).replace('.', ',')} = 1`, cx + R * 1.3, ys0 + fs * 2.6);
    ctx.fillText('1', (cx + px) / 2 - fs * 0.8 * Math.sin(th), (cy + py) / 2 - fs * 0.8 * Math.cos(th));

    // Hint de første sekundene (forsvinner av seg selv)
    if (t < 6 && !document.fullscreenElement) {
      ctx.globalAlpha = Math.min(1, (6 - t) / 1.5) * 0.6; ctx.fillStyle = '#c8d0d8';
      ctx.font = `400 ${Math.max(12, fs * 0.8)}px "Segoe UI", system-ui, sans-serif`;
      const ht = 'Dobbeltklikk for fullskjerm'; ctx.fillText(ht, W - ctx.measureText(ht).width - 24, H - 24); ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
